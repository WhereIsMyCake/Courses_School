site_name: Learning at School
site_url: https://whereismycake.github.io/Courses_School/
site_description:  学校的课程笔记和学习资料maybe
site_author: MJ

theme:
  name: material
  language: zh
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - navigation.sections
    - navigation.footer
  palette:
    - scheme: default
      primary: blue
      accent: light blue

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/cover-typewriter.js
  - javascripts/mathjax.js
  - assets/vendor/mathjax/3.2.2/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 英语文体学: ZJUcourse/stylistics.md
  - 地图学:
    - 总复习: ZJUcourse/Cartograhpy/note.md
    - 历年卷: ZJUcourse/Cartograhpy/exams.md
  - 现代气候学:
    - 复习: ZJUcourse/Climatology/review.md
    - 历年题: ZJUcourse/Climatology/test.md
  - 数据结构基础: 
    - 算法分析: ZJUcourse/FDS/fds_lecture1.md
    - 列表、栈、队列: ZJUcourse/FDS/fds_lecture2.md 
    - 树: ZJUcourse/FDS/fds_lecture3.md
    - 堆: ZJUcourse/FDS/fds_lecture4.md
    - 并查集: ZJUcourse/FDS/fds_lecture5.md
    - 线段树: ZJUcourse/FDS/segment_tree.md
    - 图: ZJUcourse/FDS/graph_algorithms.md
    - 排序: ZJUcourse/FDS/sorting.md
    - 哈希表: ZJUcourse/FDS/hashing.md
  - 统计学习:
    - KNN 与偏差-方差权衡: ZJUcourse/StatisticalLearning/knn.md
    - 线性回归模型: ZJUcourse/StatisticalLearning/linearreg.md
    - 因果推断: ZJUcourse/StatisticalLearning/causal_intro.md
  - 机器学习:
    - 复习: ZJUcourse/MachineLearning/review.md
  - Python程序设计: 
    - 理论部分复习: ZJUcourse/Python/python.md
  - 遥感概论:
    - 绪论: ZJUcourse/RS/chapter1.md
    - 遥感物理基础A: ZJUcourse/RS/chapter2.md
    - 遥感物理基础B: ZJUcourse/RS/chapter3.md
    - 遥感物理基础C: ZJUcourse/RS/chapter4.md
    - 遥感物理基础D: ZJUcourse/RS/chapter5.md
    - 遥感成像系统A: ZJUcourse/RS/chapter6.md
    - 遥感成像系统B: ZJUcourse/RS/chapter7.md
    - 遥感图像处理A: ZJUcourse/RS/chapter8.md
    - 遥感图像处理B: ZJUcourse/RS/chapter9.md
    - 遥感影像目视解译与制图: ZJUcourse/RS/chapter10.md
    - 遥感影像计算机解译: ZJUcourse/RS/chapter11.md
    - 历年卷: ZJUcourse/RS/exam.md
  - GIS应用开发:
    - 理论部分复习: ZJUcourse/WebGIS/review.md
    - 前端代码复习: ZJUcourse/WebGIS/front_code.md
  - 地理空间数据库:
    - 概论: ZJUcourse/SDBMS/lecture1.md
    - 关系模型与关系代数: ZJUcourse/SDBMS/lecture2.md
    - 关系数据库标准语言: ZJUcourse/SDBMS/lecture3.md
    - 几何对象模型与查询: ZJUcourse/SDBMS/lecture4.md
    - 空间扩展 E/R 图: ZJUcourse/SDBMS/lecture5.md

    

    

 
